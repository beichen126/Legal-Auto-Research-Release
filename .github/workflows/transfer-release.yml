name: Transfer release asset

on:
  push:
    paths:
      - .github/workflows/transfer-release.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download the verified archive from the source repository
        env:
          GH_TOKEN: ${{ secrets.TRANSFER_TOKEN }}
        run: |
          mkdir transfer
          gh release download v0.1.10-local-debug \
            --repo beichen126/Legal-Auto-Research \
            --pattern Legal-Auto-Research-win-x64-0.1.10-local-debug.zip \
            --dir transfer
          echo "10cd64869bfd7ff8ffc2ed200dfe58cee378e15287583ec2c839df931ce1b199  transfer/Legal-Auto-Research-win-x64-0.1.10-local-debug.zip" | sha256sum --check

      - name: Upload the archive to this repository
        env:
          GH_TOKEN: ${{ secrets.TRANSFER_TOKEN }}
        run: |
          gh release upload v0.1.10-local-debug \
            transfer/Legal-Auto-Research-win-x64-0.1.10-local-debug.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
